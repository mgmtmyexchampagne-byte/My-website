<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Listen to myexchampagne.">
    <title>Listen now | myexchampagne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #f4f1e9;
            --muted: #a6aaa3;
            --background: #111312;
            --line: rgba(244, 241, 233, .16);
            --lime: #c9dd55;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--background); }
        body { min-height: 100vh; margin: 0; background: var(--background); color: var(--ink); font-family: Manrope, sans-serif; }
        a { color: inherit; }
        .page { width: min(1100px, calc(100% - 48px)); margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; }
        .wordmark { font-family: 'Caveat', cursive; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .back-link { color: var(--muted); font: .68rem 'DM Mono', monospace; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; }
        .back-link:hover { color: var(--lime); }
        main { display: grid; place-items: center; padding: 42px 0 80px; }
        .listening-panel { width: min(100%, 420px); }
        h1 { margin: 0 0 28px; font-size: clamp(2.8rem, 7vw, 5rem); font-weight: 700; letter-spacing: -.06em; line-height: .95; text-align: center; text-transform: uppercase; }
        .cover { aspect-ratio: 1 / 1; overflow: hidden; border: 1px solid var(--line); background: #252a27; }
        .cover img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
        .release-name { margin: 18px 0 12px; font-family: 'Caveat', cursive; font-size: 1.6rem; }
        .release-note { margin: 0 0 18px; color: var(--muted); font: .68rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
        .service-list { border: 1px solid var(--line); }
        .service { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-decoration: none; transition: background .2s ease, color .2s ease; }
        .service:last-child { border-bottom: 0; }
        .service:hover { background: var(--lime); color: #17211f; }
        .service-icon { width: 32px; height: 32px; object-fit: contain; flex: 0 0 auto; }
        .service-icon-letter { display: grid; place-items: center; border-radius: 50%; background: #f34a5e; color: #fff; font-family: Georgia, serif; font-size: 1.15rem; font-weight: 700; }
        .service-label { font-size: .84rem; font-weight: 600; }
        .service-arrow { margin-left: auto; font-size: 1.2rem; }
        footer { padding: 0 0 28px; color: var(--muted); font: .65rem 'DM Mono', monospace; letter-spacing: .08em; text-align: center; text-transform: uppercase; }

        @media (max-width: 600px) {
            .page { width: min(100% - 32px, 420px); }
            header { padding-top: 18px; }
            main { padding-top: 38px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <a class="wordmark" href="index.html">myexchampagne</a>
            <a class="back-link" href="index.html">Back home</a>
        </header>

        <main>
            <section class="listening-panel" aria-labelledby="listen-heading">
                <h1 id="listen-heading">Listen now</h1>
                <div class="cover">
                    <img src="Assets%20folder/Main%20photo.jpg" alt="myexchampagne portrait">
                </div>
                <p class="release-name">myexchampagne</p>
                <p class="release-note">Debut single / Coming soon in 2026</p>
                <div class="service-list">
                    <a class="service" href="https://music.apple.com/" target="_blank" rel="noopener">
                        <span class="service-icon service-icon-letter" aria-hidden="true">A</span>
                        <span class="service-label">Listen on Apple Music</span>
                        <span class="service-arrow" aria-hidden="true">&#8594;</span>
                    </a>
                    <a class="service" href="https://open.spotify.com/" target="_blank" rel="noopener">
                        <img class="service-icon" src="Assets%20folder/Social%20Media%20Icons/Spotify%20Icon.png" alt="">
                        <span class="service-label">Listen on Spotify</span>
                        <span class="service-arrow" aria-hidden="true">&#8594;</span>
                    </a>
                </div>
            </section>
        </main>

        <footer>Designed by Champagne</footer>
    </div>
</body>
</html>
