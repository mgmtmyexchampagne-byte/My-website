    <style>
        :root {
            --ink: #17211f;
            --muted: #71807b;
            --background: #fbfbf8;
            --line: #dfe5df;
            --lime: #c9dd55;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--background); }
        body { min-height: 100vh; margin: 0; background: var(--background); color: var(--ink); font-family: Manrope, sans-serif; }
        a { color: inherit; }
        .page { width: min(1100px, calc(100% - 48px)); margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; }
        .wordmark { font-family: 'Caveat', cursive; font-size: 1.8rem; font-weight: 600; text-decoration: none; }
        .back-link { color: var(--muted); font: 1.25rem 'Caveat', cursive; font-weight: 600; letter-spacing: .01em; text-decoration: none; }
        .back-link:hover { color: var(--ink); }
        main { display: grid; place-items: center; padding: 42px 0 80px; }
        .listening-panel { width: min(100%, 420px); }
        h1 { margin: 0 0 28px; font-size: clamp(2.8rem, 7vw, 5rem); font-weight: 700; letter-spacing: -.06em; line-height: .95; text-align: center; text-transform: uppercase; }
        .cover { aspect-ratio: 1 / 1; overflow: hidden; border: 1px solid var(--line); background: #e8ece6; }
        .cover img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
        .release-name { margin: 18px 0 12px; font-family: 'Caveat', cursive; font-size: 1.6rem; }
        .release-note { margin: 0 0 18px; color: var(--muted); font: .68rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
        .service-list { border: 1px solid var(--line); }
        .service { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-decoration: none; transition: background .2s ease, color .2s ease; }
        .service:last-child { border-bottom: 0; }
        .service:hover { background: var(--lime); color: var(--ink); }
        .service-icon { width: 32px; height: 32px; object-fit: contain; flex: 0 0 auto; }
        .service-icon-letter { display: grid; place-items: center; border-radius: 50%; background: #f34a5e; color: #fff; font-family: Georgia, serif; font-size: 1.15rem; font-weight: 700; }
        .service-label { font-size: .84rem; font-weight: 600; }
        .service-arrow { margin-left: auto; font-size: 1.2rem; }
        .image-license { display: inline-block; margin-top: 10px; color: var(--muted); font: .62rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
        .image-license:hover { color: var(--ink); }
        footer { display: flex; align-items: center; justify-content: space-between; padding: 0 0 28px; color: var(--muted); font: .65rem 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
        .footer-signature { color: var(--ink); font: 1.8rem 'Caveat', cursive; font-weight: 600; letter-spacing: .01em; text-transform: none; }

        @media (max-width: 600px) {
            .page { width: min(100% - 32px, 420px); }
            header { padding-top: 18px; }
            main { padding-top: 38px; }
        }
    </style>
